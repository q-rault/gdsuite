# Tags `v<version>` when a commit on main changes Cargo.toml's version and
# that tag does not exist yet, which starts release.yml. A release is then:
# bump the version (by hand or with the pin-tools PR), merge to main.
#
# Uses PIN_TOOLS_TOKEN (see RELEASING.md): a tag pushed with the default token would not start
# release.yml.
name: tag-release

on:
  push:
    branches: [main]
    paths: [Cargo.toml]

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.PIN_TOOLS_TOKEN }}
          fetch-depth: 0

      - name: Tag the new version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "v${version} is already tagged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${version}" -m "gdsuite v${version}"
          git push origin "v${version}"
