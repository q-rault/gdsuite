# Keeps one PR open that builds the latest release of every tool into gdsuite,
# on the `auto/pin-tools` branch. When several tools are released one after
# another, the same PR is updated. Merging it releases nothing: run Cut release
# (cut-release.yml) when you want to release.
#
# Each tool's release.yml starts this workflow once its GitHub release exists
# (with that repository's GDSUITE_TRIGGER_TOKEN secret). It can also be run
# from the Actions tab.
#
# Needs the PIN_TOOLS_TOKEN secret (see RELEASING.md):
# a PR pushed with the default token would not run CI.
name: pin-tools
run-name: pin-tools${{ inputs.release && format(' after {0}', inputs.release) || '' }}

on:
  workflow_dispatch:
    inputs:
      release:
        description: The tool release that started this run (only names the run)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: pin-tools
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # pin_tools.py runs `cargo update`.
      - uses: dtolnay/rust-toolchain@stable

      - name: Pin the latest tool releases
        id: pin
        run: python3 scripts/pin_tools.py --github-output "$GITHUB_OUTPUT"

      - name: Open or update the pin PR
        if: steps.pin.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PIN_TOOLS_TOKEN }}
          branch: auto/pin-tools
          base: main
          title: ${{ steps.pin.outputs.title }}
          body: ${{ steps.pin.outputs.body }}
          commit-message: ${{ steps.pin.outputs.title }}
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          add-paths: |
            .gdsuite-release.toml
            Cargo.toml
            Cargo.lock
          delete-branch: true
