name: e2e

# Runs gdsuite, with the tools built in, against a real Godot. Run it manually
# before a gdsuite release.
on:
  workflow_dispatch:

jobs:
  e2e:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked
      - name: Install Godot
        shell: bash
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/4.7-stable"
          mkdir -p "$RUNNER_TEMP/godot"
          case "$RUNNER_OS" in
            Linux)
              curl -fsSL -o godot.zip "$base/Godot_v4.7-stable_linux.x86_64.zip"
              unzip -q godot.zip -d "$RUNNER_TEMP/godot"
              exe="$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64" ;;
            Windows)
              curl -fsSL -o godot.zip "$base/Godot_v4.7-stable_win64.exe.zip"
              unzip -q godot.zip -d "$RUNNER_TEMP/godot"
              exe="$RUNNER_TEMP/godot/Godot_v4.7-stable_win64_console.exe" ;;
            macOS)
              curl -fsSL -o godot.zip "$base/Godot_v4.7-stable_macos.universal.zip"
              unzip -q godot.zip -d "$RUNNER_TEMP/godot"
              exe="$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" ;;
          esac
          chmod +x "$exe" || true
          echo "GODOT_EXE=$exe" >> "$GITHUB_ENV"
      - name: Run the documented workflow in a new project
        shell: bash
        run: |
          gdsuite="$PWD/target/debug/gdsuite"
          project="$RUNNER_TEMP/project"
          mkdir -p "$project/test"
          cd "$project"
          git init -q .
          printf 'config_version=5\n\n[application]\nconfig/name="e2e"\n' > project.godot
          printf 'class_name Player\nextends RefCounted\n\nvar health := 10\n\n\nfunc hit(amount: int) -> void:\n\thealth -= amount\n' > player.gd
          printf 'extends GdTest\n\n\nfunc test_hit() -> void:\n\tvar p := Player.new()\n\tp.hit(3)\n\tassert_eq(p.health, 7)\n' > test/test_player.gd
          # Godot is not on the PATH here, and only init is told where it is: every
          # later command has to use what setup remembered.
          godot="$GODOT_EXE"
          unset GODOT_EXE
          "$gdsuite" --godot-exe "$godot" init
          "$gdsuite" doctor
          "$gdsuite" test
          "$gdsuite" check
          if grep -q godot_exe gdsuite.toml; then
            echo 'gdsuite.toml must not contain a machine path'
            exit 1
          fi
          grep -qx '.gdsuite/' .gitignore
      - name: Run in a project that was never set up
        shell: bash
        run: |
          gdsuite="$PWD/target/debug/gdsuite"
          project="$RUNNER_TEMP/plain"
          mkdir -p "$project/test"
          cd "$project"
          printf 'config_version=5\n\n[application]\nconfig/name="plain"\n' > project.godot
          printf 'class_name Player\nextends RefCounted\n\nvar health := 10\n\n\nfunc hit(amount: int) -> void:\n\thealth -= amount\n' > player.gd
          printf 'extends GdTest\n\n\nfunc test_hit() -> void:\n\tvar p := Player.new()\n\tp.hit(3)\n\tassert_eq(p.health, 7)\n' > test/test_player.gd
          # The tools are built in: lint and doctor need nothing set up, and
          # the first test installs the addons tests need.
          "$gdsuite" lint
          "$gdsuite" doctor
          test ! -e .gdsuite
          "$gdsuite" test
          test -f addons/gdtest/gdtest_worker.gd
          "$gdsuite" check
          test ! -e gdsuite.toml
