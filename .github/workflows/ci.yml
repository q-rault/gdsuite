name: ci

on:
  push:
    branches: [main, 'release-*']
  pull_request:
  workflow_dispatch:

# A new push to a PR cancels the run of the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit

  validate:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Caches the build too, not only the registry.
      # Saves from main only: PR caches are not visible to other PRs.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked

      # The editor addon is GDScript: gdsuite checks it like any project's.
      # Type checking needs Godot, so it runs locally (see editor/).
      - name: Format and lint the editor addon
        if: runner.os == 'Linux'
        run: |
          cargo run --locked --quiet -- --project-root editor fmt -- --check addons/gdsuite
          cargo run --locked --quiet -- --project-root editor lint -- addons/gdsuite
