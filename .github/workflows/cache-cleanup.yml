name: Cache cleanup

# Every Cargo.lock change (each pin PR) saves a new set of caches of up to
# 270 MB each, and the repository's cache limit is 10 GB. GitHub drops caches
# unused for 7 days; this drops them after 3, so that a fresh cache from main
# is never the one evicted.
on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete caches unused for 3 days
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cutoff=$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh cache list --limit 1000 --json id,key,lastAccessedAt,sizeInBytes \
            --jq ".[] | select(.lastAccessedAt < \"${cutoff}\") | \"\(.id) \(.sizeInBytes) \(.key)\"" > old.txt
          count=0; bytes=0
          while read -r id size key; do
            gh cache delete "$id" && count=$((count + 1)) && bytes=$((bytes + size))
            echo "deleted ${key}"
          done < old.txt
          echo "Deleted ${count} caches, $((bytes / 1048576)) MB" >> "$GITHUB_STEP_SUMMARY"
