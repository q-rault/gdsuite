[package]
name = "gdsuite"
version = "0.1.0"
edition = "2024"
description = "Suite-owned CLI dispatcher for Godot projects — coordinates gdtoolkit, gdtest, and gdhealth"
license = "MIT"
repository = "https://github.com/q-rault/gdsuite"
readme = "README.md"
keywords = ["godot", "gamedev", "cli", "tooling"]
categories = ["development-tools", "command-line-utilities"]
exclude = [
    ".ai/",
    ".codex/",
    "docs/",
    "scripts/",
    ".gdsuite-release.toml",
    "CLAUDE.md",
    "AGENTS.md",
    "gdsuite-*.md",
]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
globwalk = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
thiserror = "2.0"
toml = "0.8"
which = "8.0"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.12"
