[package]
name = "gdsuite"
version = "0.4.1"
edition = "2024"
rust-version = "1.96"
authors = ["Quentin Rault"]
description = "Format, lint, type check, test and measure Godot projects: gdtidy, gdtypecheck, gdtest and gdhealth in one CLI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/q-rault/gdsuite"
homepage = "https://github.com/q-rault/gdsuite"
readme = "README.md"
keywords = ["godot", "gamedev", "cli", "tooling"]
categories = ["development-tools", "command-line-utilities"]
include = ["/src/**", "/.gdsuite-release.toml", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/LICENSE.md"]

[dependencies]
# The tools built into gdsuite, at exact versions: .gdsuite-release.toml
# records the same versions. To try a tool's unreleased changes, add to
# .cargo/config.toml: [patch.crates-io] gdtest = { path = "../gdtest/crates/gdtest" }
gdhealth = "=0.3.6"
gdtest = "=0.2.7"
gdtidy = "=0.3.4"
gdtypecheck = "=0.2.4"
anstream = "1.0"
anstyle = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
globwalk = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
thiserror = "2.0"
toml = "0.8"
which = "8.0"
zip = { version = "9.4", default-features = false, features = ["deflate"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.12"
