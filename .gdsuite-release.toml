[suite]
version = "0.7.7"
manifest_version = 1

# The tools are built into gdsuite: `tested` is the version each one has.
[tools.gdtest]
acquire = { kind = "bundled" }
tested = "==0.2.14"

[tools.gdhealth]
acquire = { kind = "bundled" }
tested = "==0.3.7"

[tools.gdtypecheck]
acquire = { kind = "bundled" }
tested = "==0.2.6"

[tools.gdtidy]
acquire = { kind = "bundled" }
tested = "==0.3.7"

[contracts.gdtest]
required_harness = "==0.2.14"

[contracts.gdhealth]
required_schema_version = 1
