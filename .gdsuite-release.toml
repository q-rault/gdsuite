[suite]
version = "0.4.1"
manifest_version = 1

# The tools are built into gdsuite: `tested` is the version each one has.
[tools.gdtest]
acquire = { kind = "bundled" }
tested = "==0.2.6"

[tools.gdhealth]
acquire = { kind = "bundled" }
tested = "==0.3.5"

[tools.gdtypecheck]
acquire = { kind = "bundled" }
tested = "==0.2.3"

[tools.gdtidy]
acquire = { kind = "bundled" }
tested = "==0.3.3"

[contracts.gdtest]
required_harness = "==0.2.6"

[contracts.gdhealth]
required_schema_version = 1
